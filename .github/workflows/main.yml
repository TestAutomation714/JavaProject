name: Selenium Tests CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # Allows manual triggering from the GitHub Actions UI

jobs:
  build:
    runs-on: ubuntu-latest # Uses a fresh Ubuntu virtual machine for the job

    steps:
    - uses: actions/checkout@v4 # Action to check out your repository code
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4 # Action to set up the Java environment
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
        
    - name: Install Google Chrome
      # Commands to install the actual Chrome browser on the Ubuntu VM
      run: |
        sudo apt-get update
        sudo apt-get install google-chrome-stable
        chrome --version
        
    - name: Run Tests with Maven
      run: mvn clean test # Command to execute your tests (adjust for your build tool)
      
    - name: Upload Test Reports
      uses: actions/upload-artifact@v4 # Action to upload test results as artifacts
      with:
        name: test-report
        path: target/surefire-reports # Adjust path based on your test runner's output
